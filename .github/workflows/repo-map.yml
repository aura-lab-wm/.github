name: repository map

# The map on the org profile is generated from the live org, so it cannot drift the way a
# hand-written table does. Hourly, on demand, and on request from any repo in the org:
#   gh api repos/aura-lab-wm/.github/dispatches -f event_type=repo-map
on:
  schedule:
    - cron: "17 * * * *"      # hourly, off the hour: GitHub's on-the-hour queues are the busiest
  workflow_dispatch:
  repository_dispatch:
    types: [repo-map]

concurrency:
  group: repo-map
  cancel-in-progress: true

permissions:
  contents: write             # the job commits the regenerated block, nothing else

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the generator before trusting it with a public file
        run: python3 -m unittest discover -s scripts -q

      - name: Regenerate the map
        env:
          # A token that can SEE private repos is what makes the counts right. Without it the API
          # returns public repos only and the map would silently under-count, so the step fails
          # instead: add a fine-grained org token with "Metadata: read" as the ORG_MAP_TOKEN secret.
          GITHUB_TOKEN: ${{ secrets.ORG_MAP_TOKEN }}
        run: |
          test -n "$GITHUB_TOKEN" || { echo "::error::ORG_MAP_TOKEN is not set — private repos would be invisible and the counts wrong"; exit 1; }
          python3 scripts/build_repo_map.py --org "${GITHUB_REPOSITORY%%/*}" --write profile/README.md

      - name: Commit only when the map actually moved
        run: |
          git config user.name  "aura-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- profile/README.md; then
            echo "map unchanged — nothing to commit"
            exit 0
          fi
          git add profile/README.md
          git commit -m "Repository map: refresh from the live org [skip ci]"
          git push
