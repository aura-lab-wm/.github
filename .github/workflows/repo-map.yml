name: repository map

# The map on the org profile is generated from the live org, so it cannot drift the way a
# hand-written table does. Hourly, on demand, and on request from any repo in the org:
#   gh api repos/aura-lab-wm/.github/dispatches -f event_type=repo-map
on:
  schedule:
    - cron: "17 * * * *"      # hourly, off the hour: GitHub's on-the-hour queues are the busiest
  workflow_dispatch:
  repository_dispatch:
    types: [repo-map]
  pull_request:
    paths:
      - '.github/workflows/repo-map.yml'
      - 'scripts/**'

concurrency:
  group: repo-map-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the generator before trusting it with a public file
        run: python3 -m unittest discover -s scripts -q

  map:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the map
        env:
          # Full counts are optional. The built-in token supports the explicitly public-only view.
          GITHUB_TOKEN: ${{ secrets.ORG_MAP_TOKEN || github.token }}
          REPO_SCOPE: ${{ secrets.ORG_MAP_TOKEN != '' && 'all' || 'public' }}
        run: |
          if [ "$REPO_SCOPE" = public ]; then
            echo 'Public repository map: private repository counts are excluded because ORG_MAP_TOKEN is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/build_repo_map.py --org "${GITHUB_REPOSITORY%%/*}" --scope "$REPO_SCOPE" --write profile/README.md

      - name: Commit only when the map actually moved
        run: |
          git config user.name  "aura-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- profile/README.md; then
            echo "map unchanged — nothing to commit"
            exit 0
          fi
          git add profile/README.md
          git commit -m "Repository map: refresh from the live org [skip ci]"
          git push
