  <text x="22" y="52" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="2.4" fill="#17485a">04</text>
  <text x="22" y="108" font-family="Archivo, Helvetica Neue, sans-serif" font-weight="800" font-size="22" fill="#0b0f0d">AI Agents &amp;</text>
  <text x="22" y="136" font-family="Archivo, Helvetica Neue, sans-serif" font-weight="800" font-size="22" fill="#0b0f0d">Task-Aware</text>
